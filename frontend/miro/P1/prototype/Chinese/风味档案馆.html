<script>
  (() => {
    const shellScroller = document.querySelector(".nexus-shell-screen");
    const deviceShell = document.querySelector(".nexus-shell-device");
    const dockNode = deviceShell?.querySelector("nav.bottom-dock");
    if (deviceShell && shellScroller && dockNode && shellScroller.contains(dockNode)) {
      deviceShell.appendChild(dockNode);
    }
    const fallbackScroller = document.scrollingElement || document.documentElement;
    if (deviceShell && !deviceShell.querySelector(".dock-shadow-mask")) {
      const mask = document.createElement("div");
      mask.className = "dock-shadow-mask";
      mask.style.zIndex = "14";
      const dock = deviceShell.querySelector("nav.bottom-dock");
      if (dock) {
        deviceShell.insertBefore(mask, dock);
      } else {
        deviceShell.appendChild(mask);
      }
    }
    if (fallbackScroller) {
      fallbackScroller.scrollTop = 0;
    }
    if (shellScroller) {
      shellScroller.scrollTop = 0;
    }

  })();
</script>
<script src="instant-food-api-bridge.js"></script>
<script>
  (function () {
    const bridge = window.InstantFoodApiBridge || null;
    const grid = document.querySelector(".masonry-grid");
    const filterRow = document.querySelector(".archive-filters");
    const DEFAULT_TAG = "全部档案";
    const LOCAL_ARCHIVE_COVER_POOL = Object.freeze([
      "../../assets/backgrounds/琥珀凝脂.jpg",
      "../../assets/backgrounds/鎏火骨吟.jpg",
      "../../assets/backgrounds/青叶稻香.jpg",
      "../../assets/backgrounds/土地与火.jpg",
      "../../assets/backgrounds/春意·三文鱼.jpg",
      "../../assets/backgrounds/夏之切片.jpg"
    ]);

    if (!bridge || !grid || !filterRow) {
      return;
    }

    function normalizeText(value, fallback) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return text || fallback;
    }

    function formatTime(rawValue) {
      const input = String(rawValue || "").trim();
      if (!input) {
        return "刚刚";
      }
      const parsed = new Date(input);
      if (Number.isNaN(parsed.getTime())) {
        return "刚刚";
      }
      return `${parsed.getMonth() + 1} 月 ${parsed.getDate()} 日 ${String(parsed.getHours()).padStart(2, "0")}:${String(parsed.getMinutes()).padStart(2, "0")}`;
    }

    function hashArchiveSeed(input) {
      const source = String(input || "").trim();
      let hash = 0;
      for (let index = 0; index < source.length; index += 1) {
        hash = (hash * 33 + source.charCodeAt(index)) >>> 0;
      }
      return hash;
    }

    function resolveArchiveCover(seed) {
      if (!LOCAL_ARCHIVE_COVER_POOL.length) {
        return "";
      }
      const hash = hashArchiveSeed(seed);
      return LOCAL_ARCHIVE_COVER_POOL[hash % LOCAL_ARCHIVE_COVER_POOL.length];
    }

    function normalizeRecord(record) {
      if (!record || typeof record !== "object") {
        return null;
      }

      const title = normalizeText(record.title, "");
      if (!title) {
        return null;
      }

      return {
        id: normalizeText(record.id, title),
        title: title,
        time: formatTime(record.shared_at || record.created_at || record.updated_at),
        tag: record.is_shared ? "已发布" : "已保存",
        image: resolveArchiveCover([
          normalizeText(record.id, ""),
          normalizeText(record.recipe_id, ""),
          normalizeText(title, "")
        ].join("|")),
        recipeId: normalizeText(record.recipe_id, "")
      };
    }

    function buildTags(records) {
      const tags = [];
      records.forEach((record) => {
        if (record.tag && !tags.includes(record.tag)) {
          tags.push(record.tag);
        }
      });
      return [DEFAULT_TAG, ...tags];
    }

    function renderFilters(tags, activeTag, onChange) {
      filterRow.innerHTML = "";
      tags.forEach((tag) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "archive-filter";
        button.textContent = tag;
        if (tag === activeTag) {
          button.classList.add("active");
        }
        button.addEventListener("click", (event) => {
          event.preventDefault();
          onChange(tag);
        });
        filterRow.appendChild(button);
      });
    }

    function createCard(record, index) {
      const card = document.createElement("article");
      const ratio = 110 + (index % 4) * 10;
      card.className = "masonry-item rounded-2xl overflow-hidden dark:bg-surface-dark border border-gray-200 dark:border-gray-800 relative group shadow-glass obsidian-glass";
      card.style.borderRadius = "40px";
      card.dataset.archiveTag = record.tag;
      card.innerHTML = [
        `<div class="relative w-full" style="padding-bottom:${ratio}%;">`,
        record.image
          ? `  <img alt="${record.title}" class="absolute inset-0 w-full h-full object-cover" src="${record.image}">`
          : '  <div class="absolute inset-0" style="display:flex;align-items:flex-end;padding:18px;background:radial-gradient(circle at 20% 18%, rgba(142,182,155,0.24) 0%, rgba(142,182,155,0) 28%), linear-gradient(180deg, rgba(18,22,24,0.98), rgba(8,10,12,0.98));"><span style="color:rgba(255,255,255,0.92);font-size:14px;line-height:1.45;font-weight:600;">暂无封面图</span></div>',
        '  <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>',
        "</div>",
        '<div class="archive-card-meta">',
        `  <p class="archive-card-title">${record.title}</p>`,
        '  <div class="archive-card-time">',
        '    <span class="material-icons">schedule</span>',
        `    <span>${record.time}</span>`,
        "  </div>",
        "</div>"
      ].join("");
      return card;
    }

    function renderEmpty(copy) {
      grid.innerHTML = [
        '<div class="archive-empty">',
        '  <div>',
        '    <p class="archive-empty-title">暂无归档</p>',
        `    <p class="archive-empty-copy">${copy}</p>`,
        "  </div>",
        "</div>"
      ].join("");
    }

    function renderRecords(records, activeTag) {
      const visible = activeTag === DEFAULT_TAG
        ? records
        : records.filter((record) => record.tag === activeTag);

      if (!visible.length) {
        renderEmpty(records.length ? "当前筛选下还没有归档。" : "生成菜谱后会自动加入这里。");
        return;
      }

      const leftLane = document.createElement("div");
      const rightLane = document.createElement("div");
      leftLane.className = "archive-waterfall-lane";
      rightLane.className = "archive-waterfall-lane";
      grid.innerHTML = "";
      grid.append(leftLane, rightLane);

      visible.forEach((record, index) => {
        const card = createCard(record, index);
        (index % 2 === 0 ? leftLane : rightLane).appendChild(card);
      });
    }

    async function hydrateFromBackend() {
      const userId = bridge.getUserId(window);
      if (!userId) {
        renderFilters([DEFAULT_TAG], DEFAULT_TAG, () => {});
        renderEmpty("生成菜谱后会自动加入这里。");
        return;
      }

      const payload = await bridge.fetchJson(
        bridge.buildApiUrl("/api/v1/archives?user_id=" + encodeURIComponent(userId), window),
        { method: "GET" }
      );

      const records = Array.isArray(payload && payload.archives)
        ? payload.archives.map((item) => normalizeRecord(item)).filter(Boolean)
        : [];
      const tags = buildTags(records);
      let activeTag = DEFAULT_TAG;

      const commitRender = () => {
        renderFilters(tags, activeTag, (nextTag) => {
          activeTag = nextTag;
          commitRender();
        });
        renderRecords(records, activeTag);
      };

      commitRender();
    }

    hydrateFromBackend().catch((error) => {
      console.error("archive-backend-hydrate-failed", error);
      renderFilters([DEFAULT_TAG], DEFAULT_TAG, () => {});
      renderEmpty("档案同步失败，请稍后再试一次。");
    });
  })();
</script>
</body></html>
