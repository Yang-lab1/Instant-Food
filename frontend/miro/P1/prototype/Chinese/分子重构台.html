        }
      } catch (error) {}
      window.location.href = href;
    }

    function readCapturedImagesForFingerprint() {
      const byBridge = bridge && typeof bridge.readCapturedImages === "function"
        ? bridge.readCapturedImages(window)
        : [];
      const fallback = bridge && typeof bridge.readCapturedImage === "function"
        ? bridge.readCapturedImage(window)
        : "";
      const source = Array.isArray(byBridge) && byBridge.length ? byBridge : (fallback ? [fallback] : []);
      return source
        .filter((item) => typeof item === "string" && item.indexOf("data:") === 0)
        .slice(0, MAX_RECOGNITION_IMAGES);
    }

    function buildCaptureFingerprint(images) {
      if (!Array.isArray(images) || !images.length) {
        return "";
      }
      return images
        .map((item, index) => {
          const raw = String(item || "");
          const middleIndex = Math.max(0, Math.floor(raw.length / 2) - 48);
          const head = raw.slice(0, 96);
          const middle = raw.slice(middleIndex, middleIndex + 96);
          const tail = raw.slice(-96);
          return [index, raw.length, head, middle, tail].join(":");
        })
        .join("|");
    }

    function parseQuantity(text) {
      const normalized = text.replace(/\s+/g, "");
      const descriptiveMatch = normalized.match(/^(少量|适量|少许|若干)$/);
      if (descriptiveMatch) {
        return {
          count: 1,
          unit: descriptiveMatch[1]
        };
      }
      const match = normalized.match(/^(\d+)(.+)$/);
      return {
        count: match ? Number(match[1]) : 1,
        unit: match ? match[2] : "份"
      };
    }

    function normalizeMeasureUnit(rawUnit) {
      const unit = String(rawUnit || "").trim().toLowerCase();
      if (!unit) return "份";
      if (unit === "g") return "克";
      if (unit === "kg") return "公斤";
      if (unit === "ml") return "毫升";
      if (unit === "l") return "升";
      return String(rawUnit || "").trim();
    }

    function formatQuantityFull(count, unit) {
      const normalizedUnit = normalizeMeasureUnit(unit).replace(/\s+/g, "");
      if (!normalizedUnit) {
        return String(count || 1) + "份";
      }
      if (/^(少量|适量|少许|若干)$/.test(normalizedUnit)) {
        return normalizedUnit;
      }
      return String(count || 1) + normalizedUnit;
    }

    function formatQuantity(count, unit) {
      const normalizedUnit = normalizeMeasureUnit(unit).replace(/\s+/g, "");
      if (!normalizedUnit) {
        return String(count || 1) + "份";
      }

      const descriptiveMatch = normalizedUnit.match(/(少量|适量|少许|若干)/);
      if (descriptiveMatch) {
        return descriptiveMatch[1];
      }

      const cleanedUnit = normalizedUnit
        .replace(/^[约約]/, "")
        .replace(/(左右|大约|大概|约莫|约摸)/g, "")
        .replace(/[\(（].*?[\)）]/g, "");

      if (/^\d+(?:\.\d+)?(克|公斤|千克|毫升|升)$/.test(cleanedUnit)) {
        return cleanedUnit;
      }

      const primaryUnitMatch = cleanedUnit.match(/^(只|块|颗|个|瓣|份|条|根|片|把|串|朵|枚|杯|袋|碗|盘|盒|支|包|勺|毫升|克|公斤|千克|升)/);
      if (primaryUnitMatch) {
        return String(count || 1) + primaryUnitMatch[1];
      }

      return String(count || 1) + (cleanedUnit.charAt(0) || "份");
    }

    function normalizeIngredientName(text, fallback) {
      const cleaned = text.replace(/\s+/g, " ").trim();
      return cleaned || fallback;
    }

    function isManualPlaceholderName(rawName) {
      return normalizeIngredientName(rawName || "", "其他食材") === "其他食材";
    }

    function syncManualIngredientInclusion(item) {
      if (!item || !item.manual) {
        return;
      }

      const currentName = normalizeIngredientName(item.name.textContent, item.defaultName);
      const hasCustomIngredient = !isManualPlaceholderName(currentName);
      if (hasCustomIngredient && !item.included) {
        item.included = true;
      }
      if (!hasCustomIngredient && item.count <= 1 && item.unit === "份") {
        item.included = false;
      }
    }

    function parseEstimatedQuantity(rawValue) {
      const normalized = String(rawValue || "").replace(/\s+/g, "");
      const descriptiveMatch = normalized.match(/(少量|适量|少许|若干)/);
      if (descriptiveMatch) {
        return {
          count: 1,
          unit: descriptiveMatch[1]
        };
      }

      const measuredMatch = normalized.match(/(?:约|約|大约|大概)?(\d+(?:\.\d+)?)(公斤|千克|kg|克|g|毫升|ml|升|l|颗|个|只|块|瓣|份|条|根|片|把|串|朵|枚|杯|袋|碗|盘|盒|支|包|勺)/i);
      if (measuredMatch) {
        return {
          count: Number(measuredMatch[1]) || 1,
          unit: normalizeMeasureUnit(measuredMatch[2])
        };
      }

      const match = normalized.match(/^(\d+)(.+)$/);
      return {
        count: match ? Number(match[1]) : 1,
        unit: match && match[2] ? normalizeMeasureUnit(match[2]) : "份"
      };
    }

    function mapRecognitionTechnique(rawTechnique) {
      const technique = String(rawTechnique || "").trim();
      if (!technique) {
        return "";
      }
      if (
        technique.includes("免火") ||
        technique.includes("凉拌") ||
        technique.includes("冷盘") ||
        technique.includes("冷食") ||
        technique.includes("沙拉") ||
        technique.includes("三明治") ||
        technique.includes("酸奶") ||
        technique.includes("不加热") ||
        technique.includes("无需加热")
      ) {
        return "免火";
      }
      if (technique.includes("烤") || technique.includes("焗")) {
        return "烘烤";
      }
      if (technique.includes("煎")) {
        return "煎封";
      }
      if (technique.includes("炒") || technique.includes("爆")) {
        return "快炒";
      }
      if (technique.includes("煮") || technique.includes("炖") || technique.includes("慢")) {
        return "低温慢煮";
      }
      return RANDOM_SELECTION_LABEL;
    }

    const ingredients = ingredientCards.map((card, index) => {
      const name = card.querySelector(".ingredient-name");
      const quantity = card.querySelector(".quantity-value");
      const buttons = card.querySelectorAll("button");
      const decrementButton = buttons[0];
      const incrementButton = buttons[1];
      const toggleButton = buttons[2];
      const parsedQuantity = parseQuantity(quantity.textContent);
      const defaults = ingredientDefaults[index] || {
        name: name.textContent.trim(),
        count: parsedQuantity.count,
        unit: parsedQuantity.unit,
        included: true
      };

      return {
        card,
        name,
        quantity,
        decrementButton,
        incrementButton,
        toggleButton,
        count: parsedQuantity.count,
        unit: parsedQuantity.unit,
        included: defaults.included,
        defaultName: defaults.name,
        manual: card.dataset.manual === "true" || defaults.manual === true
      };
    });

    function paintIngredient(item) {
      const isManualMuted = item.manual && !item.included;
      item.quantity.textContent = formatQuantity(item.count, item.unit);
      item.quantity.title = formatQuantityFull(item.count, item.unit);
      item.card.style.opacity = item.included ? "1" : (isManualMuted ? "0.78" : "0.46");
      item.name.style.color = item.included ? "#FFFFFF" : (isManualMuted ? "rgba(255, 255, 255, 0.82)" : "rgba(255, 255, 255, 0.56)");
      item.name.style.textDecoration = item.included || isManualMuted ? "none" : "line-through";
      item.quantity.style.color = item.included ? "#FFFFFF" : (isManualMuted ? "rgba(255, 255, 255, 0.66)" : "rgba(255, 255, 255, 0.48)");

      [item.decrementButton, item.incrementButton].forEach((button) => {
        button.disabled = !item.included;
        button.style.opacity = item.included ? "1" : "0.36";
        button.style.cursor = item.included ? "pointer" : "not-allowed";

      item.toggleButton.disabled = false;

      item.toggleButton.style.backgroundColor = item.included ? "#235347" : "rgba(255, 255, 255, 0.05)";
      item.toggleButton.style.color = item.included ? "#FFFFFF" : "rgba(255, 255, 255, 0.68)";
      item.toggleButton.style.borderColor = item.included ? "#235347" : "rgba(255, 255, 255, 0.1)";
      const toggleIcon = item.toggleButton.querySelector(".material-symbols-outlined");
      if (toggleIcon) {
        toggleIcon.textContent = item.included ? "check" : "close";
      }
    }

    function setRecognitionLoadingState(isLoading) {
      ingredients.forEach((item) => {
        if (isLoading) {
          item.name.textContent = "";
          item.quantity.textContent = "";
          item.quantity.title = "";
          item.card.style.opacity = "0.42";
          item.name.style.color = "rgba(255, 255, 255, 0.38)";
          item.quantity.style.color = "rgba(255, 255, 255, 0.38)";
          [item.decrementButton, item.incrementButton, item.toggleButton].forEach((button) => {

        paintIngredient(item);

      if (startGenerateButton) {

        startGenerateButton.style.opacity = isLoading ? "0.56" : "1";

    }

    function syncIngredientDefault(item, patch) {
      item.defaultName = patch.name;
      item.count = patch.count;
      item.unit = patch.unit;
      item.included = patch.included;
      item.name.textContent = normalizeIngredientName(patch.name, item.defaultName);
      paintIngredient(item);
    }

    ingredients.forEach((item) => {
      item.name.setAttribute("contenteditable", "true");
      item.name.setAttribute("spellcheck", "false");
      item.name.setAttribute("role", "textbox");
      item.name.setAttribute("aria-label", "食材名称，可编辑");
      item.name.textContent = normalizeIngredientName(item.name.textContent, item.defaultName);

      paintIngredient(item);

      item.name.addEventListener("keydown", (event) => {

      });

      item.name.addEventListener("paste", (event) => {
        event.preventDefault();

        item.name.textContent = normalizeIngredientName(pasted, item.defaultName);
        item.name.blur();
      });

      item.name.addEventListener("blur", () => {
        item.name.textContent = normalizeIngredientName(item.name.textContent, item.defaultName);
        syncManualIngredientInclusion(item);
        paintIngredient(item);
      });

      item.decrementButton.addEventListener("click", () => {
        if (!item.included) return;

      item.incrementButton.addEventListener("click", () => {
        if (!item.included) return;

    });

    const chipGroups = [
      { key: "technique", buttons: Array.from(document.querySelectorAll('[data-chip-group="technique"] .selection-chip')), multi: false },
      { key: "tools", buttons: Array.from(document.querySelectorAll('[data-chip-group="tools"] .selection-chip')), multi: true },
      { key: "tastes", buttons: Array.from(document.querySelectorAll('[data-chip-group="tastes"] .selection-chip')), multi: true }
    ];

    function getChipGroup(key) {
      return chipGroups.find((group) => group.key === key) || { key, buttons: [], multi: false, selected: new Set() };
    }

    function paintChipGroup(group) {
      group.buttons.forEach((button) => {
        const selected = group.selected.has(button.textContent.trim());
        button.style.borderColor = selected ? "#235347" : "rgba(255, 255, 255, 0.12)";
        button.style.backgroundColor = selected ? "#235347" : "rgba(28, 28, 30, 0.5)";
        button.style.color = "#FFFFFF";
        button.style.boxShadow = selected ? "0 4px 12px rgba(35, 83, 71, 0.36)" : "none";

    function enableHorizontalDrag(scroller) {
      if (!scroller) return;

      const state = {
        isPointerDown: false,
        isDragging: false,
        suppressClick: false,
        suppressClickTimer: null,
        pointerId: null,
        startX: 0,
        startY: 0,
        startScrollLeft: 0,
        lastX: 0,
        lastTime: 0,
        velocity: 0,
        overscroll: 0,
        momentumFrame: null,
        bounceTimer: null
      };

      function maxScroll() {
        return Math.max(0, scroller.scrollWidth - scroller.clientWidth);
      }

      function setOverscroll(offset) {
        state.overscroll = offset;
        scroller.style.transform = "translate3d(" + offset.toFixed(2) + "px, 0, 0)";
      }

      function clearAnimations() {
        if (state.momentumFrame) {
          cancelAnimationFrame(state.momentumFrame);
          state.momentumFrame = null;
        }

        if (state.bounceTimer) {
          clearTimeout(state.bounceTimer);
          state.bounceTimer = null;
        }

        if (state.suppressClickTimer) {
          clearTimeout(state.suppressClickTimer);
          state.suppressClickTimer = null;
        }

        scroller.style.transition = "";
      }

      function bounceBack() {
        if (!state.overscroll) return;
        clearAnimations();
        scroller.style.transition = "transform 460ms cubic-bezier(0.22, 1.12, 0.36, 1)";
        requestAnimationFrame(() => {
          setOverscroll(0);
        });
        state.bounceTimer = setTimeout(() => {
          scroller.style.transition = "";
          state.bounceTimer = null;
        }, 480);
      }

      function applyScroll(targetScrollLeft) {
        const limit = maxScroll();
        if (targetScrollLeft < 0) {
          scroller.scrollLeft = 0;
          setOverscroll(Math.min(42, -targetScrollLeft * 0.28));
          return;
        }

        if (targetScrollLeft > limit) {
          scroller.scrollLeft = limit;
          setOverscroll(-Math.min(42, (targetScrollLeft - limit) * 0.28));
          return;
        }

        if (state.overscroll !== 0) {
          setOverscroll(0);
        }

        scroller.scrollLeft = targetScrollLeft;
      }

      function startMomentum() {
        if (Math.abs(state.velocity) < 0.04) {
          bounceBack();
          return;
        }

        let currentVelocity = state.velocity * 18;

        function step() {
          currentVelocity *= 0.94;

          if (Math.abs(currentVelocity) < 0.18) {
            state.momentumFrame = null;
            bounceBack();
            return;
          }

          const nextScrollLeft = scroller.scrollLeft + currentVelocity;
          applyScroll(nextScrollLeft);

          if ((scroller.scrollLeft <= 0 && currentVelocity < 0) || (scroller.scrollLeft >= maxScroll() && currentVelocity > 0)) {
            currentVelocity *= 0.52;
            if (Math.abs(currentVelocity) < 0.6) {
              state.momentumFrame = null;
              bounceBack();
              return;
            }
          }

          state.momentumFrame = requestAnimationFrame(step);
        }

        state.momentumFrame = requestAnimationFrame(step);
      }

      function finishDrag() {
        if (state.pointerId !== null && typeof scroller.releasePointerCapture === "function") {
          try {
            scroller.releasePointerCapture(state.pointerId);
          } catch (error) {}
        }
        state.isPointerDown = false;
        state.pointerId = null;
        if (state.isDragging) {
          state.suppressClick = true;
          if (state.suppressClickTimer) {
            clearTimeout(state.suppressClickTimer);
          }
          state.suppressClickTimer = setTimeout(() => {
            state.suppressClick = false;
            state.suppressClickTimer = null;
          }, 220);
          startMomentum();
        } else {
          state.suppressClick = false;
          bounceBack();
        }
        window.requestAnimationFrame(() => {
          state.isDragging = false;
          scroller.classList.remove("is-dragging");
        });
      }

      scroller.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        clearAnimations();
        state.isPointerDown = true;
        state.isDragging = false;
        state.suppressClick = false;
        state.pointerId = event.pointerId;
        state.startX = event.clientX;
        state.startY = event.clientY;
        state.lastX = event.clientX;
        state.lastTime = performance.now();
        state.velocity = 0;
        state.startScrollLeft = scroller.scrollLeft;
      });

      scroller.addEventListener("pointermove", (event) => {
        if (!state.isPointerDown || state.pointerId !== event.pointerId) return;

        const now = performance.now();
        const deltaX = event.clientX - state.startX;
        const deltaY = event.clientY - state.startY;
        const deltaTime = Math.max(now - state.lastTime, 16);

        if (!state.isDragging) {
          if (Math.abs(deltaX) < 18 || Math.abs(deltaX) <= Math.abs(deltaY) * 1.25) return;
          state.isDragging = true;
          state.suppressClick = true;
          if (state.suppressClickTimer) {
            clearTimeout(state.suppressClickTimer);
          }
          state.suppressClickTimer = setTimeout(() => {
            state.suppressClick = false;
            state.suppressClickTimer = null;
          }, 220);
          if (typeof scroller.setPointerCapture === "function") {
            try {
              scroller.setPointerCapture(event.pointerId);
            } catch (error) {}
          }
          scroller.classList.add("is-dragging");
        }

        state.velocity = (state.lastX - event.clientX) / deltaTime;
        state.lastX = event.clientX;
        state.lastTime = now;

        applyScroll(state.startScrollLeft - deltaX);
      });

      scroller.addEventListener("pointerup", finishDrag);
      scroller.addEventListener("pointercancel", finishDrag);
      scroller.addEventListener("lostpointercapture", finishDrag);

      scroller.addEventListener("click", (event) => {
        if (!state.suppressClick) return;
        event.preventDefault();
        event.stopPropagation();
        state.suppressClick = false;
        if (state.suppressClickTimer) {
          clearTimeout(state.suppressClickTimer);
          state.suppressClickTimer = null;
        }
      }, true);
    }

    chipGroups.forEach((group) => {
      group.selected = new Set();

      function paintChip(button, selected) {
        button.style.borderColor = selected ? "#235347" : "rgba(255, 255, 255, 0.12)";
        button.style.backgroundColor = selected ? "#235347" : "rgba(28, 28, 30, 0.5)";
        button.style.color = "#FFFFFF";
        button.style.boxShadow = selected ? "0 4px 12px rgba(35, 83, 71, 0.36)" : "none";
      }

      function paintGroup() {
        group.buttons.forEach((button) => {
          paintChip(button, group.selected.has(button.textContent.trim()));
        });
      }

      group.buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const value = button.textContent.trim();

          if (group.multi) {
            if (value === RANDOM_SELECTION_LABEL) {
              group.selected.clear();
              group.selected.add(RANDOM_SELECTION_LABEL);
            } else {
              group.selected.delete(RANDOM_SELECTION_LABEL);
              if (group.selected.has(value)) {
                group.selected.delete(value);
              } else {
                group.selected.add(value);
              }
              if (!group.selected.size) {
                group.selected.add(RANDOM_SELECTION_LABEL);
              }
            }
          } else {
            group.selected.clear();
            group.selected.add(value);
          }

          paintGroup();
        });
      });

      paintGroup();
    });

    function applyDefaultChipSelections() {
      const techniqueGroup = getChipGroup("technique");
      const toolsGroup = getChipGroup("tools");
      const tastesGroup = getChipGroup("tastes");
      const allAvailable = {
        technique: new Set(techniqueGroup.buttons.map((button) => button.textContent.trim())),
        tools: new Set(toolsGroup.buttons.map((button) => button.textContent.trim())),
        tastes: new Set(tastesGroup.buttons.map((button) => button.textContent.trim()))
      };

      techniqueGroup.selected = allAvailable.technique.has(DEFAULT_SELECTIONS.technique)
        ? new Set([DEFAULT_SELECTIONS.technique])
        : new Set();
      toolsGroup.selected = new Set(DEFAULT_SELECTIONS.tools.filter((item) => allAvailable.tools.has(item)));
      tastesGroup.selected = new Set(DEFAULT_SELECTIONS.tastes.filter((item) => allAvailable.tastes.has(item)));
      chipGroups.forEach((group) => {
        paintChipGroup(group);
      });
    }

    applyDefaultChipSelections();

    Array.from(document.querySelectorAll(".chip-scroll")).forEach(enableHorizontalDrag);

    function buildPayload() {
      const includedIngredients = ingredients
        .map((item) => {
          const normalizedName = normalizeIngredientName(item.name.textContent, item.defaultName);
          return {
            name: normalizedName,
            count: item.count,
            unit: item.unit,
            included: item.included,
            manual: item.manual
          };
        })
        .filter((item) => {
          if (!item.included) {
            return false;
          }
          if (!item.name) {
            return false;
          }
          if (item.manual && isManualPlaceholderName(item.name)) {
            return false;
          }
          return true;
        });

      const techniqueGroup = getChipGroup("technique");
      const toolsGroup = getChipGroup("tools");
      const tastesGroup = getChipGroup("tastes");

      return {
        ingredients: includedIngredients.map((item) => ({
          name: item.name,
          count: item.count,
          unit: item.unit,
          included: true
        })),
        technique: Array.from(techniqueGroup.selected || [])[0] || "",
        tools: Array.from(toolsGroup.selected || []),
        tastes: Array.from(tastesGroup.selected || [])
      };
    }

    function applyRecognitionResult(result) {
      const recognizedIngredients = Array.isArray(result && result.ingredients) ? result.ingredients : [];
      const nextDefaults = ingredientDefaults.map((item) => Object.assign({}, item));

      ingredients.forEach((item, index) => {
        if (item.manual) {
          return;
        }

        const recognized = recognizedIngredients[index];
        if (!recognized) {
          const fallback = {
            name: item.defaultName,
            count: item.count,
            unit: item.unit,
            included: item.included,
            manual: false
          };
          nextDefaults[index] = fallback;
          return;
        }

        const quantity = parseEstimatedQuantity(recognized.estimated_quantity);
        const patch = {
          name: normalizeIngredientName(recognized.name || item.defaultName, item.defaultName),
          count: quantity.count,
          unit: quantity.unit,
          included: true,
          manual: false
        };
        nextDefaults[index] = patch;
        syncIngredientDefault(item, patch);
      });

      const manualItem = ingredients.find((item) => item.manual);
      if (manualItem) {
        const remainingIngredients = recognizedIngredients.slice(Math.max(ingredients.length - 1, 0));
        const manualNames = remainingIngredients
          .map((item) => normalizeIngredientName(item && item.name, ""))
          .filter(Boolean);
        const patch = manualNames.length
          ? {
              name: manualNames.join(" / "),
              count: manualNames.length,
              unit: "项",
              included: true,
              manual: true
            }
          : {
              name: "其他食材",
              count: 1,
              unit: "份",
              included: false,
              manual: true
            };
        nextDefaults[nextDefaults.length - 1] = patch;
        syncIngredientDefault(manualItem, patch);
      }

      ingredientDefaults = nextDefaults;

      const mappedTechnique = mapRecognitionTechnique(result && result.cooking_method);
      const techniqueGroup = getChipGroup("technique");
      if (mappedTechnique && techniqueGroup.buttons.length) {
        techniqueGroup.selected = new Set([mappedTechnique]);
        paintChipGroup(techniqueGroup);
      }

    }

    async function requestRecognitionWithRetry(capturedImage) {
      if (!bridge) {
        throw new Error("bridge-not-available");
      }

      const maxAttempts = 2;
      let lastError = null;

      for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
        const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timeoutId = window.setTimeout(() => {
          if (controller) {
            controller.abort();
          }
        }, 90000);

        try {
          const response = await bridge.fetchJson(
            bridge.buildApiUrl("/api/v1/recognize/image", window),
            {
              method: "POST",
              body: JSON.stringify({ image_base64: capturedImage }),
              signal: controller ? controller.signal : undefined
            }
          );
          const result = extractRecognitionPayload(response);
          if (!hasRecognizedIngredients(result)) {
            const emptyResultError = new Error("recognition-empty-result");
            emptyResultError.code = "recognition-empty-result";
            throw emptyResultError;
          }
          return response;
        } catch (error) {
          lastError = error;
          if (attempt < maxAttempts) {
            setRecognitionHint("识别耗时较长，正在重试一次…");
          }
        } finally {
          window.clearTimeout(timeoutId);
        }
      }

      throw lastError || new Error("recognition-request-failed");
    }

    function extractRecognitionPayload(response) {
      return response && (response.result || response.recognition || response);
    }

    function hasRecognizedIngredients(result) {
      const ingredients = Array.isArray(result && result.ingredients) ? result.ingredients : [];
      return ingredients.some((item) => normalizeIngredientName(item && item.name, "").trim());
    }

    function normalizeIngredientKey(rawName) {
      return String(rawName || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "");
    }

    function mergeRecognitionResults(results) {
      const ingredientMap = new Map();
      const techniqueCounter = new Map();

      results.forEach((result) => {
        const technique = String(result && result.cooking_method || "").trim();
        if (technique) {
          techniqueCounter.set(technique, (techniqueCounter.get(technique) || 0) + 1);
        }

        const list = Array.isArray(result && result.ingredients) ? result.ingredients : [];
        list.forEach((item) => {
          const name = normalizeIngredientName(item && item.name, "");
          if (!name) {
            return;
          }

          const key = normalizeIngredientKey(name);
          const quantity = String(item && item.estimated_quantity || "").trim();
          const confidence = Number(item && item.confidence);
          const score = Number.isFinite(confidence) ? confidence : 0;

          if (!ingredientMap.has(key)) {
            ingredientMap.set(key, {
              name: name,
              estimated_quantity: quantity || "适量",
              confidence: score,
              score: score
            });
            return;
          }

          const existing = ingredientMap.get(key);
          existing.score += score;
          if (score > existing.confidence) {
            existing.name = name;
            existing.confidence = score;
          }
          if (!existing.estimated_quantity && quantity) {
            existing.estimated_quantity = quantity;
          }
        });
      });

      const mergedIngredients = Array.from(ingredientMap.values())
        .sort((a, b) => (b.score || 0) - (a.score || 0))
        .map((item) => ({
          name: item.name,
          estimated_quantity: item.estimated_quantity || "适量",
          confidence: item.confidence || 0
        }));

      const topTechnique = Array.from(techniqueCounter.entries())
        .sort((a, b) => b[1] - a[1])[0];

      return {
        ingredients: mergedIngredients,
        cooking_method: topTechnique ? topTechnique[0] : ""
      };
    }

    async function hydrateCapturedRecognition() {
      const capturedImages = bridge && typeof bridge.readCapturedImages === "function"
        ? bridge.readCapturedImages(window)
        : [];
      const fallbackCapturedImage = bridge ? bridge.readCapturedImage(window) : "";
      const allImages = (capturedImages && capturedImages.length ? capturedImages : [fallbackCapturedImage])
        .filter((item) => typeof item === "string" && item.indexOf("data:") === 0);
      const imagesToRecognize = allImages.slice(0, MAX_RECOGNITION_IMAGES);
      const droppedImageCount = Math.max(0, allImages.length - imagesToRecognize.length);

      if (!imagesToRecognize.length) {
        setRecognitionHint("当前未检测到拍摄图，请先拍摄或上传后再识别。");
        return;
      }

      if (capturedPreviewImage) {
        capturedPreviewImage.src = imagesToRecognize[0];
        capturedPreviewImage.alt = "本次拍摄的食材预览";
      }

      if (!bridge) {
        setRecognitionHint("已载入本次拍摄，当前页面未接入识别桥接。");
        return;
      }

      const apiBaseUrl = bridge.getApiBaseUrl(window);
      if (apiBaseUrl === null || apiBaseUrl === undefined) {
        setRecognitionHint("已载入本次拍摄，未配置本地 API，暂未自动识别。");
        return;
      }

      const totalImages = imagesToRecognize.length;
      if (totalImages > 1) {
        let loadingHint = "已载入" + totalImages + "张拍摄图，正在逐张识别并合并结果…";
        if (droppedImageCount > 0) {
          loadingHint += "（最多识别5张）";
        }
        setRecognitionHint(loadingHint);
      } else {
        setRecognitionHint("已载入本次拍摄，正在同步识别结果…");
      }
      setRecognitionLoadingState(true);

      try {
        const settled = [];
        const failedImageIndexes = [];
        for (let index = 0; index < imagesToRecognize.length; index += 1) {
          const image = imagesToRecognize[index];
          if (totalImages > 1) {
            setRecognitionHint(
              "正在识别第 " + (index + 1) + " / " + totalImages + " 张拍摄图…"
            );
          }
          try {
            const response = await requestRecognitionWithRetry(image);
            settled.push({ ok: true, response });
          } catch (error) {
            failedImageIndexes.push(index + 1);
            settled.push({ ok: false, error });
          }
        }

        if (failedImageIndexes.length) {
          const incompleteError = new Error("recognition-incomplete");
          incompleteError.failedImageIndexes = failedImageIndexes;
          incompleteError.totalImages = totalImages;
          incompleteError.droppedImageCount = droppedImageCount;
          throw incompleteError;
        }

        const successResults = settled
          .map((item) => extractRecognitionPayload(item.response))
          .filter((item) => item && Array.isArray(item.ingredients) && item.ingredients.length);

        if (successResults.length !== totalImages) {
          throw new Error("recognition-result-count-mismatch");
        }

        const mergedResult = mergeRecognitionResults(successResults);
        if (!hasRecognizedIngredients(mergedResult)) {
          throw new Error("merged-recognition-empty-result");
        }
        applyRecognitionResult(mergedResult);

        if (totalImages > 1) {
          let doneHint = "已完整识别 " + totalImages + " / " + totalImages + " 张拍摄图，可继续微调食材与技法。";
          if (droppedImageCount > 0) {
            doneHint += "（额外 " + droppedImageCount + " 张未参与识别）";
          }
          setRecognitionHint(doneHint);
        } else {
          setRecognitionHint("已同步本次拍摄内容，可继续微调食材与技法。");
        }
      } catch (error) {
        console.error("recognition-prefill-failed", error);
        const status = Number(error && error.status);
        const message = String(error && error.message || "");
        const isAbort = message.toLowerCase().includes("abort");
        const failedImageIndexes = Array.isArray(error && error.failedImageIndexes)
          ? error.failedImageIndexes
          : [];
        if (failedImageIndexes.length) {
          const failedLabel = failedImageIndexes.join("、");
          let failureHint = "第 " + failedLabel + " 张拍摄图识别失败，请重新识别；全部成功后才会展示结果。";
          if (error && Number(error.totalImages) > 1) {
            failureHint = "第 " + failedLabel + " / " + error.totalImages + " 张拍摄图识别失败，请重新识别；全部成功后才会展示结果。";
          }
          if (Number(error && error.droppedImageCount) > 0) {
            failureHint += "（额外 " + error.droppedImageCount + " 张未参与识别）";
          }
          setRecognitionHint(failureHint);
        } else if (status === 400) {
          setRecognitionHint("已载入本次拍摄，但识别请求被拦截，请稍后重试或改为手动确认食材。");
        } else if (isAbort) {
          setRecognitionHint("已载入本次拍摄，但识别超时，可先手动确认食材。");
        } else {
          setRecognitionHint("已载入本次拍摄，但自动识别失败，可手动确认食材。");
        }
      } finally {
        setRecognitionLoadingState(false);
      }
    }

    function resetSelections() {
      ingredients.forEach((item, index) => {
        const defaults = ingredientDefaults[index] || {
          name: item.defaultName,
          count: item.count,
          unit: item.unit,
          included: item.included
        };

        item.name.textContent = defaults.name;
        item.count = defaults.count;
        item.unit = defaults.unit;
        item.included = defaults.included;
        paintIngredient(item);
      });

      const techniqueGroup = getChipGroup("technique");
      const toolsGroup = getChipGroup("tools");
      const tastesGroup = getChipGroup("tastes");
      techniqueGroup.selected = new Set([DEFAULT_SELECTIONS.technique]);
      toolsGroup.selected = new Set(DEFAULT_SELECTIONS.tools);
      tastesGroup.selected = new Set(DEFAULT_SELECTIONS.tastes);
      chipGroups.forEach((group) => {
        paintChipGroup(group);
      });
    }

    function normalizeSelectedItems(values) {
      return Array.isArray(values)
        ? values.map((item) => String(item || "").trim()).filter(Boolean)
        : [];
    }

    function applyStoredSelectionToForm(selection) {
      if (!selection || typeof selection !== "object") {
        return false;
      }

      const selectedIngredients = Array.isArray(selection.ingredients)
        ? selection.ingredients
            .filter((item) => item && String(item.name || "").trim())
            .map((item) => ({
              name: normalizeIngredientName(item.name, "待识别食材"),
              count: Math.max(1, Number(item.count || 1) || 1),
              unit: normalizeMeasureUnit(item.unit || "份") || "份"
            }))
        : [];

      const fixedItems = ingredients.filter((item) => !item.manual);
      fixedItems.forEach((item, index) => {
        const source = selectedIngredients[index];
        if (source) {
          item.name.textContent = source.name;
          item.count = source.count;
          item.unit = source.unit;
          item.included = true;
        } else {
          item.name.textContent = "待识别食材";
          item.count = 1;
          item.unit = "份";
          item.included = false;
        }
        paintIngredient(item);
      });

      const manualItem = ingredients.find((item) => item.manual);
      if (manualItem) {
        const remaining = selectedIngredients.slice(fixedItems.length);
        if (remaining.length) {
          manualItem.name.textContent = remaining.map((item) => item.name).join(" / ");
          manualItem.count = remaining.length;
          manualItem.unit = "项";
          manualItem.included = true;
        } else {
          manualItem.name.textContent = "其他食材";
          manualItem.count = 1;
          manualItem.unit = "份";
          manualItem.included = false;
        }
        paintIngredient(manualItem);
      }

      const techniqueGroup = getChipGroup("technique");
      const toolsGroup = getChipGroup("tools");
      const tastesGroup = getChipGroup("tastes");

      const availableTechnique = new Set(techniqueGroup.buttons.map((button) => button.textContent.trim()));
      const selectedTechnique = String(selection.technique || "").trim();
      techniqueGroup.selected = selectedTechnique && availableTechnique.has(selectedTechnique)
        ? new Set([selectedTechnique])
        : new Set(availableTechnique.has(DEFAULT_SELECTIONS.technique) ? [DEFAULT_SELECTIONS.technique] : []);

      const toolCandidates = normalizeSelectedItems(selection.tools);
      const availableTools = new Set(toolsGroup.buttons.map((button) => button.textContent.trim()));
      const nextTools = toolCandidates.filter((tool) => availableTools.has(tool));
      toolsGroup.selected = nextTools.length
        ? new Set(nextTools)
        : new Set(DEFAULT_SELECTIONS.tools.filter((tool) => availableTools.has(tool)));

      const tasteCandidates = normalizeSelectedItems(selection.tastes);
      const availableTastes = new Set(tastesGroup.buttons.map((button) => button.textContent.trim()));
      const nextTastes = tasteCandidates.filter((taste) => availableTastes.has(taste));
      tastesGroup.selected = nextTastes.length
        ? new Set(nextTastes)
        : new Set(DEFAULT_SELECTIONS.tastes.filter((taste) => availableTastes.has(taste)));

      chipGroups.forEach((group) => {
        paintChipGroup(group);
      });

      return true;
    }

    function hydrateFromStoredSelection(captureFingerprint) {
      if (!captureFingerprint) {
        return false;
      }
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return false;
      }

      try {
        const parsed = JSON.parse(raw);
        if ((parsed && parsed.selectionSchemaVersion) !== SELECTION_SCHEMA_VERSION) {
          sessionStorage.removeItem(STORAGE_KEY);
          return false;
        }
        if (!captureFingerprint || parsed.captureFingerprint !== captureFingerprint) {
          return false;
        }
        if (!applyStoredSelectionToForm(parsed)) {
          return false;
        }
        setRecognitionHint("已加载上次确认内容，可继续调整，无需重新识别。");
        return true;
      } catch (error) {
        console.warn("hydrate-selection-failed", error);
        return false;
      }
    }

    if (backToCaptureButton) {
      backToCaptureButton.href = buildShellUrl("stage2/camera", "拍摄.html");
      backToCaptureButton.addEventListener("click", navigateToCapture, true);
    }

    resetButton.addEventListener("click", () => {
      const shouldReset = window.confirm("重置当前食材名称、数量、技法和味觉选择？");
      if (shouldReset) {
        resetSelections();
      }
    });

    startGenerateButton.addEventListener("click", () => {
      ingredients.forEach((item) => {
        if (item.manual) {
          item.name.textContent = normalizeIngredientName(item.name.textContent, item.defaultName);
          syncManualIngredientInclusion(item);
          paintIngredient(item);
        }
      });

      const payload = buildPayload();
      const hasIngredient = payload.ingredients.length > 0;

      if (!hasIngredient) {
        window.alert("请至少保留一个食材，再进入确认菜单。");
        return;
      }

      payload.selectionSchemaVersion = SELECTION_SCHEMA_VERSION;
      payload.captureFingerprint = buildCaptureFingerprint(readCapturedImagesForFingerprint());
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      window.location.href = "加载过渡.html";
    });

    const currentCaptureFingerprint = buildCaptureFingerprint(readCapturedImagesForFingerprint());
    if (!hydrateFromStoredSelection(currentCaptureFingerprint)) {
      hydrateCapturedRecognition();
    }
  })();
</script>
