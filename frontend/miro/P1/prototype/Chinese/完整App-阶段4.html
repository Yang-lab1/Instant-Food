<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拍立食 | 阶段4</title>
  <link rel="stylesheet" href="wechat-unified.css" />
  <style>
    :root {
      color-scheme: dark;
      --stage4-bg:
        radial-gradient(circle at 14% 12%, rgba(35, 83, 71, 0.3) 0%, rgba(35, 83, 71, 0) 28%),
        radial-gradient(circle at 86% 16%, rgba(142, 182, 155, 0.14) 0%, rgba(142, 182, 155, 0) 24%),
        linear-gradient(180deg, #050505 0%, #000 100%);
      --text-primary: rgba(255, 255, 255, 0.96);
      --text-secondary: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-surface: linear-gradient(180deg, rgba(28, 31, 34, 0.9), rgba(12, 13, 15, 0.94));
      --glass-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --radius-card: 28px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background: var(--stage4-bg);
      color: var(--text-primary);
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .stage4-root {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      isolation: isolate;
    }

    .stage4-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: transparent;
      opacity: 1;
      transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stage4-frame.is-switching {
      opacity: 1;
    }

    .stage4-veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 28%), rgba(6, 7, 9, 0.18);
      backdrop-filter: blur(8px) saturate(1.08);
      -webkit-backdrop-filter: blur(8px) saturate(1.08);
      transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stage4-veil.is-visible {
      opacity: 0;
    }

    .stage4-sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      background: rgba(2, 3, 4, 0.24);
      backdrop-filter: blur(10px) saturate(1.08);
      -webkit-backdrop-filter: blur(10px) saturate(1.08);
      transition: opacity 200ms ease;
    }

    .stage4-sheet-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .stage4-sheet {
      width: min(100%, 414px);
      border-radius: var(--radius-card);
      padding: 20px 20px 16px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transform: translateY(24px) scale(0.98);
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stage4-sheet-backdrop.is-visible .stage4-sheet {
      transform: translateY(0) scale(1);
    }

    .stage4-sheet-handle {
      width: 44px;
      height: 5px;
      margin: 0 auto 12px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.16);
    }

    .stage4-sheet-title {
      margin: 0;
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 650;
      color: var(--text-primary);
    }

    .stage4-sheet-copy {
      margin: 12px 0 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .stage4-sheet-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .stage4-sheet-button {
      flex: 1;
      min-height: 56px;
      border: 0;
      border-radius: var(--radius-pill);
      font: inherit;
      font-size: 15px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 160ms ease;
    }

    .stage4-sheet-button:active {
      transform: scale(0.985);
    }

    .stage4-sheet-button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stage4-sheet-button.primary {
      background: linear-gradient(135deg, rgba(142, 182, 155, 0.94), rgba(35, 83, 71, 0.96));
      color: #fff;
      box-shadow: 0 14px 32px rgba(35, 83, 71, 0.28);
    }
  </style>
</head>
<body>
  <div class="stage4-root">
    <iframe id="stage4Frame" class="stage4-frame" title="拍立食阶段4"></iframe>
    <div id="stage4Veil" class="stage4-veil" aria-hidden="true"></div>
    <div id="stage4SheetBackdrop" class="stage4-sheet-backdrop" aria-hidden="true">
      <div class="stage4-sheet" role="dialog" aria-modal="true" aria-labelledby="stage4SheetTitle">
        <div class="stage4-sheet-handle" aria-hidden="true"></div>
        <h2 id="stage4SheetTitle" class="stage4-sheet-title">入口暂未切换</h2>
        <p id="stage4SheetCopy" class="stage4-sheet-copy">当前页面保持在阶段 4 壳内，不直接跳出总装链路。</p>
        <div class="stage4-sheet-actions">
          <button id="stage4SheetClose" type="button" class="stage4-sheet-button secondary">关闭</button>
          <button id="stage4SheetPrimary" type="button" class="stage4-sheet-button primary">知道了</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const frame = document.getElementById("stage4Frame");
      const veil = document.getElementById("stage4Veil");
      const sheetBackdrop = document.getElementById("stage4SheetBackdrop");
      const sheetTitle = document.getElementById("stage4SheetTitle");
      const sheetCopy = document.getElementById("stage4SheetCopy");
      const sheetClose = document.getElementById("stage4SheetClose");
      const sheetPrimary = document.getElementById("stage4SheetPrimary");

      const routeTitles = {
        community: "拍立食 | 社区",
        archive: "拍立食 | 档案馆",
        settings: "拍立食 | 个人设置",
        result: "拍立食 | 生成结果"
      };

      const routeFiles = {
        community: "社区.html",
        archive: "风味档案馆.html",
        settings: "策展人设置.html",
        result: "艺术的诞生.html"
      };
      const DEFAULT_API_BASE_URL = "https://instant-food-backend-api-20260402.vercel.app";
      const DEFAULT_USER_ID = "frontend-demo-user";

      const placeholderContent = {
        "placeholder-nexus": {
          title: "Nexus 入口保留",
          copy: "当前阶段 4 只负责社区、档案馆、设置和结果页。回到首页会由总装壳统一接管。"
        },
        "placeholder-camera": {
          title: "拍摄入口保留在阶段 2",
          copy: "拍摄和识别链路继续由阶段 2 负责，避免在阶段 4 壳内混入旧流程。"
        },
        "placeholder-auth": {
          title: "登录链路保留在总装入口",
          copy: "身份验证和退出登录会由总装页统一接回，这里先保持当前页面不直接跳出。"
        }
      };

      const localRoutes = new Map([
        ["社区.html", "community"],
        ["风味档案馆.html", "archive"],
        ["策展人设置.html", "settings"],
        ["艺术的诞生.html", "result"],
        ["Nexus.html", "__shell-stage2-home"],
        ["拍摄.html", "__shell-stage2-camera"],
        ["身份验证.html", "__shell-stage1-auth"],
        ["登录.html", "__shell-stage1-auth"]
      ]);

      const state = {
        currentRoute: "archive",
        pendingRoute: null
      };

      function normalizeRoute(rawRoute) {
        const route = String(rawRoute || "").replace(/^#/, "").trim();
        return Object.prototype.hasOwnProperty.call(routeFiles, route) ? route : "archive";
      }

      function buildRouteUrl(fileName) {
        const baseHref =
          (window.top && window.top !== window && window.top.location && window.top.location.href) ||
          (window.parent && window.parent !== window && window.parent.location && window.parent.location.href) ||
          window.location.href;
        const shellUrl = new URL(baseHref, window.location.href);
        const targetUrl = new URL(fileName, shellUrl);
        if (shellUrl.searchParams.get("apiBaseUrl")) {
          targetUrl.searchParams.set("apiBaseUrl", shellUrl.searchParams.get("apiBaseUrl"));
        } else {
          targetUrl.searchParams.set("apiBaseUrl", DEFAULT_API_BASE_URL);
        }
        if (shellUrl.searchParams.get("userId")) {
          targetUrl.searchParams.set("userId", shellUrl.searchParams.get("userId"));
        } else {
          targetUrl.searchParams.set("userId", DEFAULT_USER_ID);
        }
        return targetUrl.href;
      }

      function buildShellStageUrl(hash) {
        const baseHref =
          (window.top && window.top.location && window.top.location.href) ||
          (window.parent && window.parent.location && window.parent.location.href) ||
          window.location.href;
        const target = new URL("完整App-总装.html", baseHref);
        target.hash = hash;
        return target.href;
      }

      function navigateToShellStage(hash) {
        const nextUrl = buildShellStageUrl(hash);
        if (window.top && window.top !== window) {
          window.top.location.href = nextUrl;
          return true;
        }
        window.location.href = nextUrl;
        return true;
      }

      function setTitle(route) {
        document.title = routeTitles[route] || "拍立食 | 阶段4";
      }

      function closeSheet() {
        sheetBackdrop.classList.remove("is-visible");
        sheetBackdrop.setAttribute("aria-hidden", "true");
        frame.style.pointerEvents = "auto";
      }

      function openSheet(title, copy) {
        sheetTitle.textContent = title;
        sheetCopy.textContent = copy;
        sheetBackdrop.classList.add("is-visible");
        sheetBackdrop.setAttribute("aria-hidden", "false");
        frame.style.pointerEvents = "none";
      }

      function stopEvent(event) {
        if (!event) {
          return;
        }
        if (typeof event.preventDefault === "function") {
          event.preventDefault();
        }
        if (typeof event.stopPropagation === "function") {
          event.stopPropagation();
        }
        if (typeof event.stopImmediatePropagation === "function") {
          event.stopImmediatePropagation();
        }
      }

      function resolveLocalRoute(rawHref) {
        const normalizedHref = decodeURIComponent(String(rawHref || "").trim())
          .split("#")[0]
          .split("?")[0]
          .replace(/^\.\//, "")
          .replace(/^\/+/, "");
        const fileName = normalizedHref.split("/").pop() || normalizedHref;
        return localRoutes.get(normalizedHref) || localRoutes.get(fileName) || null;
      }

      function resetFrameSwapState(route) {
        const safeRoute = normalizeRoute(route);
        state.currentRoute = safeRoute;
        state.pendingRoute = null;
        window.currentRoute = safeRoute;
        frame.classList.remove("is-switching");
        veil.classList.remove("is-visible");
        veil.setAttribute("aria-hidden", "true");
      }

      function showRoute(nextRoute, options = {}) {
        const route = normalizeRoute(nextRoute);
        const pushHistory = options.pushHistory !== false;
        const nextFile = routeFiles[route];

        if (!nextFile) {
          return;
        }

        const nextUrl = buildRouteUrl(nextFile);

        state.pendingRoute = route;
        frame.classList.add("is-switching");
        veil.classList.add("is-visible");
        veil.setAttribute("aria-hidden", "false");
        setTitle(route);

        if (pushHistory) {
          window.history.replaceState(null, "", "#" + route);
        } else if (window.location.hash !== "#" + route) {
          window.history.replaceState(null, "", "#" + route);
        }

        const currentSrc = decodeURIComponent(frame.getAttribute("src") || "");
        if (!currentSrc || !currentSrc.includes(nextFile)) {
          frame.setAttribute("src", nextUrl);
          return;
        }

        resetFrameSwapState(route);
      }

      function handleLocalRoute(targetRoute, event, options = {}) {
        stopEvent(event);
        if (targetRoute === "__shell-stage2-home") {
          if (window.parent && typeof window.parent.loadStage === "function") {
            window.parent.loadStage("stage2");
            return true;
          }
          return navigateToShellStage("stage2");
        }
        if (targetRoute === "__shell-stage2-camera") {
          if (window.parent && typeof window.parent.loadStage === "function") {
            window.parent.loadStage("stage2", { subRoute: "camera" });
            return true;
          }
          return navigateToShellStage("stage2/camera");
        }
        if (targetRoute === "__shell-stage1-auth") {
          if (window.parent && typeof window.parent.loadStage === "function") {
            window.parent.loadStage("stage1");
            return true;
          }
          return navigateToShellStage("stage1");
        }
        if (Object.prototype.hasOwnProperty.call(routeFiles, targetRoute)) {
          showRoute(targetRoute, options);
          return true;
        }
        const payload = placeholderContent[targetRoute];
        if (payload) {
          openSheet(payload.title, payload.copy);
          return true;
        }
        return false;
      }

      function bindInnerDocument(doc) {
        if (!doc || !doc.body || doc.body.dataset.stage4ShellBound === "true") {
          return;
        }

        doc.body.dataset.stage4ShellBound = "true";

        doc.addEventListener("click", (event) => {
          const trigger = event.target.closest("a[href], [data-route]");
          if (!trigger) {
            return;
          }

          const explicitRoute = trigger.getAttribute("data-route");
          const targetRoute = explicitRoute || resolveLocalRoute(trigger.getAttribute("href") || "");
          if (!targetRoute) {
            return;
          }

          handleLocalRoute(targetRoute, event);
        }, true);
      }

      frame.addEventListener("load", () => {
        bindInnerDocument(frame.contentDocument);
        resetFrameSwapState(state.pendingRoute || state.currentRoute);
      });

      sheetClose.addEventListener("click", closeSheet);
      sheetPrimary.addEventListener("click", closeSheet);
      sheetBackdrop.addEventListener("click", (event) => {
        if (event.target === sheetBackdrop) {
          closeSheet();
        }
      });

      window.showRoute = showRoute;
      window.resetFrameSwapState = resetFrameSwapState;
      window.handleLocalRoute = handleLocalRoute;
      window.currentRoute = state.currentRoute;

      window.addEventListener("hashchange", () => {
        showRoute(window.location.hash.replace(/^#/, ""), { pushHistory: false });
      });

      const initialRoute = normalizeRoute(window.location.hash.replace(/^#/, "") || "archive");
      showRoute(initialRoute, { pushHistory: false });
    })();
  </script>
</body>
</html>
